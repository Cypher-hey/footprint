<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Footprint · 知识库</title>
        <link rel="stylesheet" href="./asset/docute.css" />
        <link rel="stylesheet" href="./asset/knowledge-reader.css" />
        <link rel="stylesheet" href="./asset/site-navigation.css" />
        <style>
            .markdown-body h4 {
                font-size: 1.2em;
            }
            .markdown-body h5 {
                font-size: 1em;
                color: #c43c3c;
            }
            .markdown-body h6 {
                font-size: 0.85em;
                color: #0080ff;
            }
            .markdown-body code {
                background-color: #f9f2f4;
                color: #c7254e;
            }
            .markdown-body a {
                color: #42b983;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>

        <script defer src="./asset/mermaid-11.17.2.min.js"></script>
        <script src="./asset/docute.js"></script>
        <script src="./asset/ai-topic-manifest.js"></script>
        <script src="./asset/topic-loader.js"></script>
        <script>
            docute.init({
                plugins: [window.FootprintReader],
                nav: [],
                icons: [
                    {
                        icon: 'link',
                        label: 'baidu',
                        link: 'http://www.baidu.com'
                    },
                    {
                        icon: 'edit',
                        label: 'codepen',
                        link: 'https://codepen.io/pen/'
                    },
                    {
                        icon: 'github',
                        label: 'Star me on GitHub',
                        link: 'https://github.com/heydadaya/footprint'
                    }
                ],
                tocVisibleDepth: 6
            });
        </script>
        <script src="./asset/knowledge-reader.js"></script>
        <script src="./asset/site-navigation-data.js"></script>
        <script src="./asset/site-navigation.js"></script>
    </body>
</html>
